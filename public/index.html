<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Constellation</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- The picture carries no information that is not also in the caption and the key, so it
     is decorative to a screen reader rather than an unlabelled blank. -->
<canvas id="sky" aria-hidden="true"></canvas>

<header id="chrome">
  <form id="form" autocomplete="off">
    <input id="src" name="src" placeholder="owner/name, a git URL, or a path on this machine" spellcheck="false" autofocus>
    <button type="submit">Plot</button>
  </form>
  <!-- Errors are only ever shown here, so they have to be announced too. -->
  <p id="status" role="status" aria-live="polite"></p>

  <!-- Every repo plotted this session, one click away. The whole point of the piece is the
       contrast between two skies, and retyping a name to get back to the previous one is
       the slowest possible way to make that comparison. -->
  <nav id="recent" hidden aria-label="Repositories plotted this session"></nav>

  <!-- Hovering a star was the only way to find out what it is, which left the whole
       picture unreachable without a mouse. This is the keyboard way in: it sits next in
       tab order after Plot, is invisible until focused, and then names itself. -->
  <div id="skyFocus" tabindex="-1" role="group"
       aria-label="Star field. Left and right arrows move between files, largest first. Escape leaves.">
    ← → between files · Esc to leave
  </div>
</header>

<!-- The dial is drawn on the canvas; this names it, because an unlabelled instrument is
     decoration. The key is DOM rather than canvas so it gets real type. -->
<p id="dialLabel" hidden>Commits by hour</p>

<aside id="key" hidden>
  <h2>Directories</h2>
  <ul id="keyList"></ul>
</aside>

<!-- Sits where the caption will sit, so plotting replaces it in place rather than moving
     the eye somewhere new. An empty screen is an invitation to act, so it names the piece,
     says what the picture means, and offers three repos you can plot without typing. -->
<section id="intro">
  <p id="introRule"></p>
  <h1>Commit Constellation</h1>
  <p class="lede">Every file is a star, sized by how often it changes. A line between two
    stars means those files keep changing in the same commit.</p>
  <p class="try">Start with
    <button type="button" data-repo="expressjs/express">expressjs/express</button>,
    <button type="button" data-repo="sveltejs/svelte">sveltejs/svelte</button> or
    <button type="button" data-repo="sindresorhus/slugify">sindresorhus/slugify</button>
  </p>
</section>

<footer id="caption" hidden>
  <p id="observed"></p>
  <h1 id="title"></h1>
  <p id="read"></p>
</footer>

<!-- Scroll and drag are invisible affordances. These say the sky moves. -->
<div id="zoom" hidden>
  <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
  <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
  <button type="button" id="zoomReset" aria-label="Reset the view" hidden>Reset</button>
</div>

<div id="tooltip" hidden></div>

<!-- The tooltip is a positioned div a screen reader has no reason to visit, so the
     selected star is announced here instead. -->
<p id="readout" class="sr-only" role="status" aria-live="polite"></p>

<script src="/vendor/p5.min.js"></script>
<script src="/sketch.js"></script>
</body>
</html>
